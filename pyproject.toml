[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatterbox-flash-server"
version = "0.1.0"
description = "Synchronous zero-shot English TTS API server for Chatterbox Flash."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# GPU: install a CUDA-enabled torch build first (README "GPU (CUDA) setup").
# On x86_64 the default-index torch is CUDA, but on aarch64 it is CPU-only, so
# an explicit CUDA build must be installed before this extra is resolved.
model = [
    "torch>=2.2",
    "librosa>=0.10",
    "chatterbox-flash @ git+https://github.com/resemble-ai/chatterbox-flash",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
chatterbox-flash-server = "flash_server.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
